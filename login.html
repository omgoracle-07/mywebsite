<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Sky Blue Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 45%, #ffffff 0%, #eef8ff 42%, #d9efff 100%);
      color: #263746;
      overflow: hidden;
    }

    .login-wrap {
      width: min(82vw, 500px);
      padding: 58px 52px 46px;
      border-radius: 50%;
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow:
        0 35px 70px rgba(74, 150, 205, .18),
        inset 0 0 35px rgba(255,255,255,.95);
      position: relative;
    }

    .login-wrap::before {
      content: "";
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      border: 2px solid rgba(119, 204, 255, .22);
      box-shadow: 0 0 35px rgba(91, 190, 255, .16);
      pointer-events: none;
    }

    .content { position: relative; z-index: 2; }

    h1 {
      text-align: center;
      font-size: clamp(42px, 7vw, 58px);
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #7890a7;
      font-size: 17px;
      margin-bottom: 42px;
    }

    .field {
      height: 62px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      margin-bottom: 22px;
      border: 1px solid rgba(104, 195, 255, .45);
      border-radius: 15px;
      background: rgba(255,255,255,.65);
      box-shadow: 0 8px 22px rgba(73, 169, 225, .10);
      transition: .25s ease;
    }

    .field:focus-within {
      border-color: #61bfff;
      box-shadow: 0 0 0 4px rgba(97,191,255,.12), 0 10px 25px rgba(73,169,225,.14);
      transform: translateY(-1px);
    }

    .icon { font-size: 21px; color: #7895ad; width: 22px; text-align: center; }
    input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #31495e;
      font-size: 17px;
    }
    input::placeholder { color: #8097ad; }

    .password-toggle {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 19px;
      color: #7794ab;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 2px 30px;
      gap: 15px;
      font-size: 14px;
      color: #6e879d;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      user-select: none;
    }

    .switch {
      width: 42px;
      height: 23px;
      border-radius: 20px;
      background: #d5e2eb;
      position: relative;
      transition: .25s;
    }

    .switch::after {
      content: "";
      width: 19px;
      height: 19px;
      position: absolute;
      top: 2px;
      left: 2px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
      transition: .25s;
    }

    #remember:checked + .switch { background: #55baff; }
    #remember:checked + .switch::after { transform: translateX(19px); }
    #remember { display: none; }

    a {
      color: #119be9;
      text-decoration: none;
      font-weight: 600;
    }

    .signin {
      width: 100%;
      height: 62px;
      border: 0;
      border-radius: 15px;
      color: white;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      cursor: pointer;
      background: linear-gradient(135deg, #72d0ff, #55aaf4);
      box-shadow: 0 12px 25px rgba(67, 166, 231, .25);
      transition: .25s ease;
    }

    .signin:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(67, 166, 231, .34);
    }

    .signin:active { transform: translateY(0); }

    .signup {
      text-align: center;
      margin: 24px auto 0;
      color: #71889e;
      font-size: 15px;
      line-height: 1.5;
      max-width: 100%;
      overflow-wrap: break-word;
    }

    .message {
      min-height: 20px;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #148ed0;
    }



    /* ===== Ultra-tech dark blue binary background ===== */
    .binary-bg {
      position: fixed;
      inset: 0;
      z-index: -4;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 50%, rgba(20, 91, 150, .28), transparent 43%),
        linear-gradient(135deg, #010713 0%, #02182c 50%, #010611 100%);
    }

    .binary-bg::before,
    .binary-bg::after {
      content:
        "01010110 00110101 11001010 10110101 01011010 11100101 00101101 10101010  "
        "11010010 01101001 10110100 01010110 11101001 00110110 10010101 01101100  "
        "10101001 11010100 00110110 10101101 01001011 11100100 10011010 01101001  "
        "01110101 10100110 01011011 11010010 00110101 10101001 01101010 10010110  ";
      position: absolute;
      left: -120%;
      width: 240%;
      color: rgba(76, 194, 255, .27);
      font-family: "Courier New", monospace;
      font-size: clamp(11px, 1.15vw, 17px);
      line-height: 2.8;
      letter-spacing: 5px;
      white-space: pre-wrap;
      word-spacing: 8px;
      word-break: break-all;
      text-shadow: 0 0 8px rgba(40, 169, 255, .32);
      will-change: transform;
    }

    /* Main binary stream: right → left */
    .binary-bg::before {
      top: -5%;
      animation: binaryRightToLeft 18s linear infinite;
    }

    /* Second stream: left → right */
    .binary-bg::after {
      top: 48%;
      opacity: .42;
      animation: binaryLeftToRight 24s linear infinite;
    }

    .binary-glow {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent 55px,
          rgba(70, 176, 255, .022) 56px,
          transparent 57px
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 55px,
          rgba(70, 176, 255, .022) 56px,
          transparent 57px
        );
      mask-image: radial-gradient(circle at center, black 0%, transparent 82%);
      animation: gridPulse 5s ease-in-out infinite alternate;
    }

    @keyframes binaryRightToLeft {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-38%); }
    }

    @keyframes binaryLeftToRight {
      0%   { transform: translateX(-38%); }
      100% { transform: translateX(0); }
    }

    @keyframes gridPulse {
      from { opacity: .45; }
      to   { opacity: .9; }
    }

    @media (prefers-reduced-motion: reduce) {
      .binary-bg::before,
      .binary-bg::after,
      .binary-glow {
        animation: none !important;
      }
    }

    /* Keep the login card bright and readable above the tech background */
    .login-wrap {
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.88), rgba(239,249,255,.72) 58%, rgba(221,242,255,.64));
      border-color: rgba(190, 232, 255, .88);
      box-shadow:
        0 35px 80px rgba(0, 0, 0, .34),
        0 0 55px rgba(51, 177, 255, .15),
        inset 0 0 35px rgba(255,255,255,.95);
    }

    /* ===== Modern animations ===== */
    body::before {
      content: "";
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: rgba(104, 201, 255, .16);
      filter: blur(55px);
      top: -130px;
      left: -100px;
      animation: glowMove 9s ease-in-out infinite alternate;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(126, 188, 255, .13);
      filter: blur(65px);
      right: -150px;
      bottom: -150px;
      animation: glowMove2 11s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .ambient {
      position: fixed;
      border-radius: 50%;
      border: 1px solid rgba(94, 190, 255, .16);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-one {
      width: 520px;
      height: 520px;
      left: -280px;
      top: 38%;
      animation: orbit 18s linear infinite;
    }

    .ambient-two {
      width: 300px;
      height: 300px;
      right: -160px;
      top: 10%;
      animation: orbitReverse 14s linear infinite;
    }

    .particles i {
      position: fixed;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(74, 184, 248, .32);
      box-shadow: 0 0 15px rgba(74, 184, 248, .3);
      pointer-events: none;
      animation: floatParticle 7s ease-in-out infinite;
    }

    .particles i:nth-child(1) { left: 8%; top: 22%; animation-delay: 0s; }
    .particles i:nth-child(2) { left: 18%; top: 76%; animation-delay: 1.2s; }
    .particles i:nth-child(3) { left: 82%; top: 24%; animation-delay: 2s; }
    .particles i:nth-child(4) { left: 90%; top: 68%; animation-delay: .7s; }
    .particles i:nth-child(5) { left: 72%; top: 88%; animation-delay: 2.8s; }
    .particles i:nth-child(6) { left: 29%; top: 12%; animation-delay: 3.5s; }
    .particles i:nth-child(7) { left: 5%; top: 52%; animation-delay: 4.2s; }
    .particles i:nth-child(8) { left: 62%; top: 8%; animation-delay: 1.8s; }

    .login-wrap {
      animation: cardEnter 1s cubic-bezier(.16,1,.3,1) both,
                 cardFloat 6s ease-in-out 1.1s infinite;
      transform-origin: center;
    }

    .login-wrap::before {
      animation: ringPulse 4s ease-in-out infinite;
    }

    .content > h1 {
      animation: textReveal .75s .2s cubic-bezier(.16,1,.3,1) both;
    }

    .subtitle {
      animation: textReveal .75s .32s cubic-bezier(.16,1,.3,1) both;
    }

    form .field:nth-of-type(1) {
      animation: fieldEnter .7s .42s cubic-bezier(.16,1,.3,1) both;
    }

    form .field:nth-of-type(2) {
      animation: fieldEnter .7s .52s cubic-bezier(.16,1,.3,1) both;
    }

    .options {
      animation: fieldEnter .7s .62s cubic-bezier(.16,1,.3,1) both;
    }

    .signin {
      position: relative;
      overflow: hidden;
      animation: fieldEnter .7s .72s cubic-bezier(.16,1,.3,1) both;
    }

    .signin::after {
      content: "";
      position: absolute;
      top: 0;
      left: -80%;
      width: 55%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
      transform: skewX(-20deg);
      animation: shine 3.2s ease-in-out 1.8s infinite;
    }

    .signup {
      animation: fieldEnter .7s .82s cubic-bezier(.16,1,.3,1) both;
    }

    .signin:hover {
      animation: buttonPulse 1.2s ease-in-out infinite;
    }

    @keyframes cardEnter {
      0% { opacity: 0; transform: scale(.78) translateY(45px) rotate(-2deg); }
      70% { opacity: 1; transform: scale(1.02) translateY(-5px) rotate(.4deg); }
      100% { opacity: 1; transform: scale(1) translateY(0) rotate(0); }
    }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: .75; }
      50% { transform: scale(1.025); opacity: 1; }
    }

    @keyframes textReveal {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fieldEnter {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shine {
      0%, 55% { left: -80%; }
      75%, 100% { left: 130%; }
    }

    @keyframes buttonPulse {
      0%, 100% { box-shadow: 0 12px 25px rgba(67,166,231,.25); }
      50% { box-shadow: 0 16px 34px rgba(67,166,231,.42); }
    }

    @keyframes glowMove {
      from { transform: translate(0, 0); }
      to { transform: translate(90px, 80px); }
    }

    @keyframes glowMove2 {
      from { transform: translate(0, 0); }
      to { transform: translate(-80px, -70px); }
    }

    @keyframes orbit {
      to { transform: rotate(360deg); }
    }

    @keyframes orbitReverse {
      to { transform: rotate(-360deg); }
    }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0) scale(1); opacity: .25; }
      50% { transform: translateY(-35px) scale(1.5); opacity: .75; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    /* ===== Responsive: Phone / Tablet / Desktop ===== */

    /* Small phones */
    @media (max-width: 380px) {
      .login-wrap {
        width: min(84vw, 360px);
        padding: 45px 22px 34px;
      }

      .login-wrap::before { inset: -10px; }

      h1 {
        font-size: 42px;
      }

      .subtitle {
        font-size: 14px;
        margin-bottom: 27px;
      }

      .field {
        height: 55px;
        margin-bottom: 16px;
        padding: 0 14px;
      }

      input {
        font-size: 15px;
      }

      .options {
        font-size: 11px;
        margin-bottom: 22px;
      }

      .switch {
        width: 36px;
        height: 20px;
      }

      .switch::after {
        width: 16px;
        height: 16px;
      }

      #remember:checked + .switch::after {
        transform: translateX(16px);
      }

      .signin {
        height: 55px;
        font-size: 14px;
      }

      .signup {
        font-size: 13px;
      }
    }

    /* Phones */
    @media (min-width: 381px) and (max-width: 600px) {
      .login-wrap {
        width: min(84vw, 410px);
        padding: 52px 30px 40px;
      }

      .login-wrap::before { inset: -12px; }

      h1 {
        font-size: 46px;
      }

      .subtitle {
        font-size: 15px;
        margin-bottom: 32px;
      }

      .field {
        height: 58px;
      }

      .options {
        font-size: 12px;
      }
    }


    @media (max-width: 600px) {
      body {
        overflow-x: hidden;
      }

      .login-wrap {
        overflow: hidden;
      }

      .signup {
        margin-top: 20px;
        padding: 0 4px;
        font-size: 12px;
        line-height: 1.45;
      }
    }

    @media (max-width: 380px) {
      .signup {
        font-size: 11px;
        margin-top: 17px;
      }
    }

    /* Tablets */
    @media (min-width: 601px) and (max-width: 1024px) {
      .login-wrap {
        width: min(54vw, 500px);
        padding: 62px 58px 50px;
      }

      h1 {
        font-size: 56px;
      }

      .subtitle {
        font-size: 18px;
        margin-bottom: 44px;
      }

      .field {
        height: 66px;
        margin-bottom: 24px;
      }

      input {
        font-size: 18px;
      }

      .options {
        font-size: 15px;
        margin-bottom: 32px;
      }

      .signin {
        height: 66px;
        font-size: 17px;
      }

      .signup {
        font-size: 16px;
      }
    }

    /* Desktop */
    @media (min-width: 1025px) {
      .login-wrap {
        width: min(36vw, 500px);
        min-width: 0;
        padding: 62px 58px 50px;
      }

      .field {
        height: 66px;
      }

      .signin {
        height: 66px;
      }
    }

    /* Large desktop / wide screens */
    @media (min-width: 1600px) {
      .login-wrap {
        width: 500px;
        padding: 66px 60px 52px;
      }
    }

    /* Landscape phones */
    @media (max-height: 600px) and (orientation: landscape) {
      body {
        overflow-y: auto;
        padding: 35px 0;
      }

      .login-wrap {
        width: min(68vw, 470px);
        padding: 38px 50px;
      }

      h1 {
        font-size: 40px;
      }

      .subtitle {
        margin-bottom: 22px;
      }

      .field {
        height: 52px;
        margin-bottom: 14px;
      }

      .options {
        margin-bottom: 18px;
      }

      .signin {
        height: 52px;
      }

      .signup {
        margin-top: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="binary-bg" aria-hidden="true"></div>
  <div class="binary-glow" aria-hidden="true"></div>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="particles" aria-hidden="true">
    <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
  </div>
  <main class="login-wrap">
    <div class="content">
      <h1>Login</h1>
      <p class="subtitle">Sign in to your account</p>

      <form id="loginForm">
        <div class="field">
          <span class="icon">👤</span>
          <input id="username" type="text" placeholder="Username" autocomplete="username" required>
        </div>

        <div class="field">
          <span class="icon">🔒</span>
          <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
          <button class="password-toggle" id="togglePassword" type="button" aria-label="Show password">◉</button>
        </div>

        <div class="options">
          <label class="remember">
            <input id="remember" type="checkbox">
            <span class="switch"></span>
            <span>Remember me</span>
          </label>
          <a href="#" id="forgotPassword">Forgot password?</a>
        </div>

        <button class="signin" type="submit">SIGN IN</button>
        <div class="message" id="message"></div>
      </form>

      <p class="signup">
        Don't have an account? <a href="#" id="signupLink">Sign up</a>
      </p>
    </div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const message = document.getElementById("message");

    togglePassword.addEventListener("click", () => {
      const isPassword = password.type === "password";
      password.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "◉" : "◌";
      togglePassword.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();

      if (!username || !password.value) {
        message.textContent = "Please enter your username and password.";
        return;
      }

      message.textContent = `Welcome, ${username}! Login button is working.`;
    });

    document.getElementById("forgotPassword").addEventListener("click", (event) => {
      event.preventDefault();
      message.textContent = "Password reset flow can be connected here.";
    });

    document.getElementById("signupLink").addEventListener("click", (event) => {
      event.preventDefault();
      message.textContent = "Signup page can be connected here.";
    });
  </script>
</body>
</html>
