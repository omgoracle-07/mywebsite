<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMGoracle | Login</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    background: #1c1c1c;
    color: #eee;
  }

  .card {
    width: 100%;
    max-width: 360px;
    padding: 2px;
    border-radius: 26px;
    background: linear-gradient(150deg, #33e39a 0%, #2fb7c9 45%, #3760f2 100%);
    box-shadow:
      0 0 24px rgba(51, 227, 154, .30),
      0 0 30px rgba(55, 96, 242, .30);
    animation: cardIn .7s cubic-bezier(.19,1,.22,1);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card2 {
    background: #171717;
    border-radius: 24px;
  }

  .form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 36px 30px 30px;
  }

  #heading {
    text-align: center;
    color: #fff;
    font-size: 1.55em;
    font-weight: 500;
    margin-bottom: 22px;
  }

  .field {
    display: flex;
    align-items: center;
    gap: .7em;
    border-radius: 25px;
    padding: .85em 1.1em;
    background: #101010;
    box-shadow: inset 0 3px 8px rgba(0,0,0,.5);
  }

  .field:focus-within {
    box-shadow:
      inset 0 3px 8px rgba(0,0,0,.5),
      0 0 0 1px rgba(51, 227, 154, .4);
  }

  .input-icon {
    height: 1.05em;
    width: 1.05em;
    fill: #999;
    flex-shrink: 0;
  }

  .input-field {
    background: none;
    border: none;
    outline: none;
    width: 100%;
    color: #eee;
    font-size: 14px;
  }

  .input-field::placeholder { color: #777; }

  .password-toggle {
    border: 0;
    background: transparent;
    color: #888;
    cursor: pointer;
    font-size: 13px;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .button1, .button2, .button3 {
    border: none;
    outline: none;
    cursor: pointer;
    color: #eee;
    background: #2a2a2a;
    border-radius: 22px;
    font-size: 14px;
    font-weight: 500;
    transition: background .25s ease, transform .15s ease;
  }

  .button1, .button2 {
    flex: 1;
    padding: .8em .8em;
  }

  .button1:hover { background: #33e39a; color: #0b0b0b; }
  .button2:hover { background: #3760f2; color: #fff; }
  .button1:active, .button2:active { transform: scale(.98); }

  .button3 {
    width: 100%;
    padding: .8em;
    margin-top: 2px;
  }

  .button3:hover { background: #333; }

  .message {
    min-height: 16px;
    text-align: center;
    margin-top: 6px;
    color: #6fd8a8;
    font-size: 12px;
  }

  .message.error { color: #e08a8a; }

  @media (max-width: 460px) {
    .form { padding: 30px 22px 24px; }
    #heading { font-size: 1.4em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }

  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid #33e39a;
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="card2">
    <form class="form" id="loginForm" novalidate>

      <p id="heading">Login</p>

      <div class="field">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-5.5 8.3"></path>
        </svg>
        <input id="username" type="text" class="input-field" placeholder="Username" autocomplete="username" required>
      </div>

      <div class="field">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="5" y="10.5" width="14" height="9.5" rx="1.6"></rect>
          <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path>
        </svg>
        <input id="password" type="password" class="input-field" placeholder="Password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">Show</button>
      </div>

      <div class="btn-row">
        <button type="submit" class="button1">Login</button>
        <button type="button" class="button2" id="signupButton">Sign Up</button>
      </div>

      <button type="button" class="button3" id="forgotButton">Forgot Password</button>

      <div class="message" id="message" role="status" aria-live="polite"></div>

    </form>
  </div>
</div>

<script>
const form = document.getElementById('loginForm');
const password = document.getElementById('password');
const togglePassword = document.getElementById('togglePassword');
const message = document.getElementById('message');

togglePassword.addEventListener('click', () => {
  const hidden = password.type === 'password';
  password.type = hidden ? 'text' : 'password';
  togglePassword.textContent = hidden ? 'Hide' : 'Show';
  togglePassword.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
});

form.addEventListener('submit', (event) => {
  event.preventDefault();
  const username = document.getElementById('username').value.trim();

  if (!username || !password.value) {
    message.classList.add('error');
    message.textContent = 'Please enter your username and password.';
    return;
  }

  message.classList.remove('error');
  message.textContent = `Welcome, ${username}! Login button is working.`;
});

document.getElementById('forgotButton').addEventListener('click', () => {
  message.classList.remove('error');
  message.textContent = 'Password reset flow can be connected here.';
});

document.getElementById('signupButton').addEventListener('click', () => {
  message.classList.remove('error');
  message.textContent = 'Signup page can be connected here.';
});
</script>

</body>
</html>
