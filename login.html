<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | OMGoracle AI Cyber Cafe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

/* ======================================
RESET
====================================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:#061225;

position:relative;

}

/* ======================================
BACKGROUND
====================================== */

body::before{

content:"";

position:absolute;

width:900px;
height:900px;

top:-250px;
left:-250px;

background:radial-gradient(circle,
rgba(0,229,255,.35),
transparent 70%);

filter:blur(70px);

animation:move1 10s linear infinite alternate;

}

body::after{

content:"";

position:absolute;

width:800px;
height:800px;

bottom:-250px;
right:-250px;

background:radial-gradient(circle,
rgba(37,99,235,.35),
transparent 70%);

filter:blur(70px);

animation:move2 12s linear infinite alternate;

}

@keyframes move1{

from{
transform:translateX(0);
}

to{
transform:translateX(180px);
}

}

@keyframes move2{

from{
transform:translateY(0);
}

to{
transform:translateY(-150px);
}

}

/* Floating Circles */

.circle{

position:absolute;

border-radius:50%;

background:rgba(255,255,255,.05);

backdrop-filter:blur(10px);

animation:float 6s ease-in-out infinite;

}

.c1{
width:120px;
height:120px;
top:10%;
left:12%;
}

.c2{
width:80px;
height:80px;
right:12%;
top:20%;
animation-delay:2s;
}

.c3{
width:140px;
height:140px;
bottom:10%;
left:18%;
animation-delay:3s;
}

.c4{
width:70px;
height:70px;
bottom:20%;
right:18%;
animation-delay:1s;
}

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-25px);
}

}

/* ======================================
LOGIN CARD
====================================== */

.login-card{

position:relative;

width:420px;

padding:40px;

border-radius:30px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.15);

box-shadow:

0 0 30px rgba(0,229,255,.18),

0 20px 60px rgba(0,0,0,.35);

z-index:10;

}

/* Logo */

.logo{

text-align:center;

margin-bottom:20px;

}

.logo img{

width:90px;

}

.logo h2{

color:#fff;

margin-top:10px;

font-size:30px;

}

.logo p{

color:#9cc8ff;

font-size:14px;

}

/* Heading */

.login-title{

text-align:center;

margin-bottom:30px;

}

.login-title h3{

color:white;

font-size:26px;

}

.login-title span{

color:#7dd3fc;

}

/* Inputs */

.input-box{

position:relative;

margin-bottom:20px;

}

.input-box input{

width:100%;

padding:16px 50px 16px 18px;

border:none;

outline:none;

border-radius:15px;

background:rgba(255,255,255,.10);

color:white;

font-size:15px;

}

.input-box input::placeholder{

color:#cbd5e1;

}

.input-box i{

position:absolute;

right:18px;

top:50%;

transform:translateY(-50%);

color:#8ec5ff;

font-size:18px;

}

/* Button */

.login-btn{

width:100%;

padding:16px;

border:none;

border-radius:15px;

background:linear-gradient(135deg,#2563eb,#00c6ff);

color:white;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:.35s;

}

.login-btn:hover{

transform:translateY(-3px);

box-shadow:0 10px 25px rgba(37,99,235,.45);

}

/* Links */

.extra{

display:flex;

justify-content:space-between;

margin-top:18px;

}

.extra a{

text-decoration:none;

color:#9fd4ff;

font-size:14px;

}

.extra a:hover{

color:white;

}

/* Responsive */

@media(max-width:500px){

.login-card{

width:92%;

padding:28px;

}

.logo img{

width:70px;

}

.login-title h3{

font-size:22px;

}

}

</style>

</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>
<div class="circle c4"></div>

<div class="login-card">

<div class="logo">

<img src="images/logo.png" alt="OMGoracle">

<h2>OMGoracle</h2>

<p>AI Cyber Cafe</p>

</div>

<div class="login-title">

<h3>Welcome <span>Back</span></h3>

</div>

<div class="input-box">

<input type="email" placeholder="Email Address">

<i class="fa-solid fa-envelope"></i>

</div>

<div class="input-box">

<input type="password" placeholder="Password" id="password">

<i class="fa-solid fa-eye" id="togglePassword"></i>

</div>

<button class="login-btn">

Login

</button>

<div class="extra">

<a href="#">Forgot Password?</a>

<a href="index.html">Back Home</a>

</div>

</div>
<script>

// ===========================
// Show / Hide Password
// ===========================

const password=document.getElementById("password");
const toggle=document.getElementById("togglePassword");

toggle.addEventListener("click",()=>{

if(password.type==="password"){

password.type="text";

toggle.classList.remove("fa-eye");
toggle.classList.add("fa-eye-slash");

}else{

password.type="password";

toggle.classList.remove("fa-eye-slash");
toggle.classList.add("fa-eye");

}

});

// ===========================
// Login Button Animation
// ===========================

const loginBtn=document.querySelector(".login-btn");

loginBtn.addEventListener("click",function(e){

e.preventDefault();

const email=document.querySelector('input[type="email"]').value.trim();
const pass=password.value.trim();

if(email==="" || pass===""){

alert("Please enter Email and Password");

return;

}

loginBtn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Logging In...';

loginBtn.disabled=true;

setTimeout(()=>{

loginBtn.innerHTML='<i class="fa-solid fa-circle-check"></i> Login Successful';

loginBtn.style.background="linear-gradient(135deg,#16a34a,#22c55e)";

setTimeout(()=>{

window.location.href="index.html";

},1200);

},1800);

});

// ===========================
// Input Focus Glow
// ===========================

document.querySelectorAll("input").forEach(input=>{

input.addEventListener("focus",()=>{

input.style.boxShadow="0 0 20px rgba(0,229,255,.45)";

});

input.addEventListener("blur",()=>{

input.style.boxShadow="none";

});

});

// ===========================
// Mouse Glow Effect
// ===========================

const glow=document.createElement("div");

glow.style.position="fixed";
glow.style.width="250px";
glow.style.height="250px";
glow.style.borderRadius="50%";
glow.style.pointerEvents="none";
glow.style.background="radial-gradient(circle,rgba(0,229,255,.20),transparent 70%)";
glow.style.filter="blur(20px)";
glow.style.transform="translate(-50%,-50%)";
glow.style.zIndex="0";

document.body.appendChild(glow);

document.addEventListener("mousemove",(e)=>{

glow.style.left=e.clientX+"px";
glow.style.top=e.clientY+"px";

});

// ===========================
// Welcome Animation
// ===========================

window.addEventListener("load",()=>{

const card=document.querySelector(".login-card");

card.animate([

{
opacity:0,
transform:"translateY(50px) scale(.95)"
},

{
opacity:1,
transform:"translateY(0) scale(1)"
}

],{

duration:900,
easing:"ease"

});

});

// ===========================
// Console
// ===========================

console.log("OMGoracle Login Page Loaded");

</script>

</body>

</html>
